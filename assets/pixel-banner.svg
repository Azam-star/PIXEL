<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 420"
     width="1200"
     height="420">

  <defs>

    <!-- Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Title -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Card backgrounds -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- ===================================================== -->
  <!-- BACKGROUND -->
  <!-- ===================================================== -->

  <rect
    x="1"
    y="1"
    width="1198"
    height="418"
    rx="16"
    fill="url(#bgGrad)"
    stroke="#38bdf8"
    stroke-opacity="0.35"
    stroke-width="2"
  />

  <!-- Grid -->
  <g opacity="0.08"
     stroke="#38bdf8"
     stroke-width="1">

    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>

    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>

  </g>


  <!-- ===================================================== -->
  <!-- HEADER BADGE -->
  <!-- ===================================================== -->

  <rect
    x="40"
    y="32"
    width="410"
    height="28"
    rx="14"
    fill="#2563eb"
    fill-opacity="0.18"
    stroke="#38bdf8"
    stroke-width="1"
  />

  <circle
    cx="56"
    cy="46"
    r="5"
    fill="#10b981"
    filter="url(#glow)"
  />

  <text
    x="70"
    y="50"
    font-family="Arial, Helvetica, sans-serif"
    font-size="12"
    font-weight="700"
    fill="#93c5fd"
    letter-spacing="0.7">
    SIH 2026 PS 26171 • ISRO / DEPT OF SPACE
  </text>


  <!-- ===================================================== -->
  <!-- TITLE -->
  <!-- ===================================================== -->

  <text
    x="40"
    y="115"
    font-family="Arial, Helvetica, sans-serif"
    font-size="52"
    font-weight="900"
    fill="url(#textGrad)"
    letter-spacing="-1.5">
    PIXEL — ODVPA
  </text>

  <text
    x="40"
    y="150"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    font-weight="500"
    fill="#94a3b8">
    On-Device Visual Perception for Lightweight Autonomous Browser Agents
  </text>


  <!-- ===================================================== -->
  <!-- CARD 1 -->
  <!-- ===================================================== -->

  <rect
    x="40"
    y="185"
    width="260"
    height="195"
    rx="12"
    fill="url(#boxGrad)"
    stroke="#38bdf8"
    stroke-opacity="0.45"
    stroke-width="1.5"
  />

  <!-- Icon -->
  <text
    x="60"
    y="220"
    font-family="Arial, Helvetica, sans-serif"
    font-size="21">
    ⚡
  </text>

  <!-- Title -->
  <text
    x="90"
    y="220"
    font-family="Arial, Helvetica, sans-serif"
    font-size="16"
    font-weight="700"
    fill="#f8fafc">
    Zero-Cost AXTree
  </text>

  <!-- Description -->
  <text
    x="60"
    y="250"
    font-family="Arial, Helvetica, sans-serif"
    font-size="12"
    fill="#94a3b8">

    <tspan x="60" dy="0">
      Extracts full accessibility tree
    </tspan>

    <tspan x="60" dy="18">
      via CDP at $0.00 cost before
    </tspan>

    <tspan x="60" dy="18">
      calling vision models.
    </tspan>

  </text>

  <!-- Metric -->
  <rect
    x="60"
    y="335"
    width="120"
    height="24"
    rx="6"
    fill="#1e293b"
  />

  <text
    x="70"
    y="351"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    font-weight="700"
    fill="#38bdf8">
    85% VLM BYPASS
  </text>


  <!-- ===================================================== -->
  <!-- CARD 2 -->
  <!-- ===================================================== -->

  <rect
    x="320"
    y="185"
    width="260"
    height="195"
    rx="12"
    fill="url(#boxGrad)"
    stroke="#818cf8"
    stroke-opacity="0.45"
    stroke-width="1.5"
  />

  <!-- Icon -->
  <text
    x="340"
    y="220"
    font-family="Arial, Helvetica, sans-serif"
    font-size="21">
    🔍
  </text>

  <!-- Title -->
  <text
    x="370"
    y="220"
    font-family="Arial, Helvetica, sans-serif"
    font-size="16"
    font-weight="700"
    fill="#f8fafc">
    Crop-Only VLM
  </text>

  <!-- Description -->
  <text
    x="340"
    y="250"
    font-family="Arial, Helvetica, sans-serif"
    font-size="12"
    fill="#94a3b8">

    <tspan x="340" dy="0">
      Crops ONLY unresolved visual
    </tspan>

    <tspan x="340" dy="18">
      patches (canvas, custom charts)
    </tspan>

    <tspan x="340" dy="18">
      instead of 4K viewports.
    </tspan>

  </text>

  <!-- Metric -->
  <rect
    x="340"
    y="335"
    width="135"
    height="24"
    rx="6"
    fill="#1e293b"
  />

  <text
    x="350"
    y="351"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    font-weight="700"
    fill="#818cf8">
    98.5% PIXEL SAVINGS
  </text>


  <!-- ===================================================== -->
  <!-- CARD 3 -->
  <!-- ===================================================== -->

  <rect
    x="600"
    y="185"
    width="260"
    height="195"
    rx="12"
    fill="url(#boxGrad)"
    stroke="#c084fc"
    stroke-opacity="0.45"
    stroke-width="1.5"
  />

  <!-- Icon -->
  <text
    x="620"
    y="220"
    font-family="Arial, Helvetica, sans-serif"
    font-size="21">
    🧠
  </text>

  <!-- Title -->
  <text
    x="650"
    y="220"
    font-family="Arial, Helvetica, sans-serif"
    font-size="16"
    font-weight="700"
    fill="#f8fafc">
    450M → 1.6B Ladder
  </text>

  <!-- Description -->
  <text
    x="620"
    y="250"
    font-family="Arial, Helvetica, sans-serif"
    font-size="12"
    fill="#94a3b8">

    <tspan x="620" dy="0">
      Tier A (450M) runs default;
    </tspan>

    <tspan x="620" dy="18">
      Tier B (1.6B) lazy-loads only
    </tspan>

    <tspan x="620" dy="18">
      on ambiguous visual confidence.
    </tspan>

  </text>

  <!-- Metric -->
  <rect
    x="620"
    y="335"
    width="130"
    height="24"
    rx="6"
    fill="#1e293b"
  />

  <text
    x="630"
    y="351"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    font-weight="700"
    fill="#c084fc">
    0 MB IDLE TIER B
  </text>


  <!-- ===================================================== -->
  <!-- CARD 4 -->
  <!-- ===================================================== -->

  <rect
    x="880"
    y="185"
    width="280"
    height="195"
    rx="12"
    fill="url(#boxGrad)"
    stroke="#10b981"
    stroke-opacity="0.45"
    stroke-width="1.5"
  />

  <!-- Icon -->
  <text
    x="900"
    y="220"
    font-family="Arial, Helvetica, sans-serif"
    font-size="21">
    🛡️
  </text>

  <!-- Title -->
  <text
    x="930"
    y="220"
    font-family="Arial, Helvetica, sans-serif"
    font-size="16"
    font-weight="700"
    fill="#f8fafc">
    5-Stage Privacy Gate
  </text>

  <!-- Description -->
  <text
    x="900"
    y="250"
    font-family="Arial, Helvetica, sans-serif"
    font-size="12"
    fill="#94a3b8">

    <tspan x="900" dy="0">
      Aadhaar, PAN, CC, passwords,
    </tspan>

    <tspan x="900" dy="18">
      and API secrets are blocked/
    </tspan>

    <tspan x="900" dy="18">
      redacted before reaching model.
    </tspan>

  </text>

  <!-- Metric -->
  <rect
    x="900"
    y="335"
    width="150"
    height="24"
    rx="6"
    fill="#1e293b"
  />

  <text
    x="910"
    y="351"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    font-weight="700"
    fill="#34d399">
    0 CLOUD DATA EGRESS
  </text>

</svg>
